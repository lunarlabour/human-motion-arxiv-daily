max_results: 20

# arXiv subject categories to search in (per-topic override via `categories`)
categories: ['cs.CV', 'cs.GR']

json_path: 'papers.json'
recent_json_path: 'recent.json'
readme_path: 'README.md'
recent_days: 7

keywords:
    "Motion Generation":
        filters: ["Motion Generation", "Motion Synthesis",
                  "Text-to-Motion", "Motion Foundation Model"]

    "Human-Scene Interaction (HSI)":
        filters: ["Human-Scene Interaction"]

    "Human-Object Interaction (HOI)":
        filters: ["Human-Object Interaction Generation", "HOI Generation"]

    "Human-Human Interaction (HHI)":
        filters: ["Human Interaction Generation", "Interactive Motion Generation"]

    "Vision-Language-Action (VLA)":
        filters: ["Vision-Language-Action", "VLA", "World Action Model"]
        categories: ['cs.RO', 'cs.CV', 'cs.LG']
