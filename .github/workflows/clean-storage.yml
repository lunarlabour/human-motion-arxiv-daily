name: Clean Storage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    name: clean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reset storage
        run: |
          echo '{}' > papers.json
          echo '{}' > recent.json
          printf '# Human Motion Arxiv Daily\n' > README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md papers.json recent.json
          if ! git diff --cached --quiet; then
            git commit -m "Clean storage"
            git push
          fi
